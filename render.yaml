services:
  - type: web
    name: onelife-club-manager
    runtime: node
    plan: starter
    branch: deploy
    buildCommand: npm install
    startCommand: node server/src/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLUB_DATA_DIR
        value: /data
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "1"
      - key: SMTP_USER
        value: onelifesocialclub@gmail.com
      - key: SMTP_FROM
        value: One Life Lanzarote <onelifesocialclub@gmail.com>
      - key: SMTP_PASS
        sync: false
      - key: CLUB_CODE
        sync: false
      - key: ADMIN_PIN
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
